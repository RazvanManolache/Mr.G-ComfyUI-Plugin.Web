name: Plugin package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate JavaScript and page dependencies
        run: python tools/check.py
      - name: Package and verify download
        run: python tools/package.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ComfyUI-Web-plugin
          path: dist/*
          if-no-files-found: error
          retention-days: 30
